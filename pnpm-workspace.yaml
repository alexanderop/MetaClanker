packages:
  - apps/*
  - examples/*
  - packages/*

catalog:
  "@agentclientprotocol/sdk": 1.3.0
  "@agentclientprotocol/codex-acp": 1.1.7
  "@agentclientprotocol/claude-agent-acp": 0.64.0
  "@effect/sql-sqlite-node": 4.0.0-beta.102
  "@effect/atom-vue": 4.0.0-beta.102
  effect: 4.0.0-beta.102
  "@effect/vitest": 4.0.0-beta.102
  typescript: 6.0.3
  vite: 8.2.0
  vue: 3.5.40

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@agentclientprotocol/sdk"
  - "@agentclientprotocol/codex-acp"
  - "@agentclientprotocol/claude-agent-acp"
  - "@vitest/browser-playwright"
  - "@vitest/coverage-v8"
  - "@vue-flow/core"
  - "@vue-flow/minimap"
  - "@vue/compiler-sfc"
  - "@vitejs/plugin-vue"
  - "@tailwindcss/vite"
  - electron
  - eslint
  - nitropack
  - oxfmt
  - oxlint
  - pinia
  - playwright
  - reka-ui
  - tailwindcss
  - typescript
  - typescript-eslint
  - vite
  - vitest
  - vue
  - vue-eslint-parser
  - vue-router
  - vue-tsc

blockExoticSubdeps: true

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  vue-demi: true

preferWorkspacePackages: true

injectWorkspacePackages: true

saveExact: true

strictPeerDependencies: true
